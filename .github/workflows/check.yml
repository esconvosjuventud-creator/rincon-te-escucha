name: Check proposed changes
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: node --experimental-strip-types --test tests/contest.test.mjs
      - run: npm run build
        env:
          VITE_BASE_PATH: /rincon-te-escucha/
